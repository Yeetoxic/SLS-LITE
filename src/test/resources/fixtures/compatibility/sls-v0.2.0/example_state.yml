blueprint:
  id: "state-contract"
  name: "State Contract"
  type: "compatibility"

server:
  software: "paper"
  version: "1.21.11"

state:
  copy:
    - source: "files/config.yml"
      target: "plugins/example/config.yml"
    - "files/server-icon.png:server-icon.png"
  env:
    FEATURE_FLAG: "true"
    PUBLIC_ENDPOINT: "https://example.test"
