blueprint:
  id: "slsmp1"
  name: "SLSMP1"
  type: "archive"

server:
  software: "paper"
  version: "1.21.1"

state:
  volumes:
    - name: "world"
      source: "worlds/archives/SLSMP1"
      target: "/world"
      mode: cow

annotations:
  vsls:
    dont-stop-when-empty: true
    max-instances: 1
    on-join:
      - run: "say hello {PLAYER_NAME}"
      - run: "playsound minecraft:block.note_block.bell ambient {PLAYER_NAME} ~ ~ ~ 1000 0"
    matchmaking:
      maxPlayers: 1
