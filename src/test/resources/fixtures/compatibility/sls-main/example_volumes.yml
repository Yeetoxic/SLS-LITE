blueprint:
  id: "volume-contract"
  name: "Volume Contract"
  type: "compatibility"

server:
  software: "paper"
  version: "1.21.1"

state:
  volumes:
    - name: "world"
      source: "worlds/main"
      target: "/world"
      mode: cow
    - name: "plugins"
      source: "plugins/common"
      target: "/plugins"
      mode: cow
    - name: "plugins"
      source: "plugins/game"
      target: "/plugins"
      mode: cow
    - assets:assets/shared:/assets:ro
    - data:shared/data:/data:rw
