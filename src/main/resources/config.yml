# Host-wide SLS-LITE settings.

resources:
  # Shared budget for managed Paper processes, excluding Velocity itself.
  total_memory_mib: 4096

network:
  ports:
    start: 25570
    end: 25670

matchmaking:
  queue_timeout_seconds: 180

lifecycle:
  # Stops empty managed servers after this delay. Set to 0 to disable globally.
  idle_shutdown_seconds: 180

lobby:
  # external uses an existing Velocity server; managed starts this blueprint locally.
  mode: external
  registry: lobby
  server: lobby
  recovery:
    # Managed-lobby retries use bounded exponential backoff. Set attempts to 0 to disable.
    max_attempts: 5
    initial_backoff_seconds: 5
    max_backoff_seconds: 60
    stable_after_seconds: 120

paths:
  # Managed paths are relative to the SLS-LITE plugin data directory.
  instances: instances
