# Host-wide SLS-LITE settings.

resources:
  # Shared budget for managed Paper processes, excluding Velocity itself.
  total_memory_mib: 4096

network:
  ports:
    start: 25570
    end: 25670

matchmaking:
  queue_timeout_seconds: 180

lobby:
  # external uses an existing Velocity server; managed starts this blueprint locally.
  mode: external
  registry: lobby
  server: lobby

paths:
  # Managed paths are relative to the SLS-LITE plugin data directory.
  instances: instances
