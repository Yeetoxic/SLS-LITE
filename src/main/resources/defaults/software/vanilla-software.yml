# Canonical optional vanilla profile. Vanilla does not support Velocity modern
# forwarding.

software:
  id: vanilla
  name: Vanilla
  runtime: java-jar
  configurator: vanilla
  source: vanilla
  channel: stable
  # Set true only after reviewing and accepting https://aka.ms/MinecraftEULA.
  # A verified manually populated cache can still be used while this is false.
  accept_eula: false
  base_directory: software/vanilla/{version}
  server_jar: server.jar

launch:
  java: java
  # java_versions may map required Java majors to configured executables.
  jvm_arguments:
    - "-Xms128M"
    - "-Xmx{memory_mib}M"
  server_arguments:
    - "--nogui"

readiness:
  pattern: 'Done \([^)]+\)! For help'
  timeout_seconds: 180

shutdown:
  command: stop
  timeout_seconds: 30
