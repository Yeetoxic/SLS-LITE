# Canonical Paper profile. Automatic installation remains disabled until the
# operator explicitly accepts the Minecraft EULA below.

software:
  id: paper
  # Optional display name; defaults to id when omitted.
  name: Paper
  runtime: java-jar
  configurator: paper
  source: paper
  # stable (default), beta, or alpha. The blueprint version remains exact.
  channel: stable
  # Set true only after reviewing and accepting https://aka.ms/MinecraftEULA.
  # A verified manually populated cache can still be used while this is false.
  accept_eula: false
  base_directory: software/paper/{version}
  server_jar: paper.jar

launch:
  java: java
  # Optional exact Java-major overrides, for example:
  # java_versions:
  #   "21": runtimes/java-21/bin/java
  #   "25": runtimes/java-25/bin/java
  jvm_arguments:
    # Keep idle and startup memory low; the blueprint reservation remains Xmx.
    - "-Xms128M"
    - "-Xmx{memory_mib}M"
  # Paper is already headless. Do not add --nogui: legacy CraftBukkit/Paper
  # releases such as 1.11.2 reject that argument and exit after printing help.
  server_arguments: []

readiness:
  pattern: 'Done \([^)]+\)! For help'
  # Historical Paperclip builds can spend several minutes preparing their first
  # runtime on a constrained host. This is only an upper bound; ready servers do
  # not wait for the full timeout.
  timeout_seconds: 600

shutdown:
  command: stop
  timeout_seconds: 30
