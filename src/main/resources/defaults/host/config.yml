# Host-wide SLS-LITE settings.
#
# All settings in this file apply after Velocity is restarted. YAML indentation
# matters: use spaces, not tabs. Sizes use MiB/KiB and durations use seconds.

resources:
  # Positive integer. Shared admission budget, in MiB, for all managed child
  # processes, including SLS-Limbo. This excludes Velocity and is not a
  # measurement of the hosting
  # panel's real memory limit. A start is rejected when its blueprint memory
  # limit would make the total reservations exceed this value.
  # Portable baseline only: enough admission room for SLS-Limbo and one modest
  # 1024 MiB server. Set this from the actual allocation after reserving room
  # for Velocity, JVM native memory, the OS/container, and other services.
  total_memory_mib: 2048

  # Positive integer. Maximum number of child processes SLS-LITE may supervise
  # at once. Defaults to the configured loopback port count when omitted and
  # cannot exceed it. SLS-Limbo consumes one slot while it is running.
  # Matches the bounded managed-port count below. Set a lower value when the
  # host imposes a stricter process limit.
  max_managed_processes: 20

network:
  ports:
    # Inclusive loopback port range used by managed backend servers. Each active
    # instance reserves one port and binds it to 127.0.0.1.
    #
    # start: integer from 1024 through 65535.
    # end: integer from start through 65535.
    # Make the range large enough for the maximum number of simultaneous
    # managed servers, and do not overlap ports used by other local services.
    start: 25570
    # The portable default exposes 20 local slots, including SLS-Limbo. Test
    # rigs or larger hosts may explicitly select a different non-conflicting
    # range after checking their panel and local-service allocations.
    end: 25589

matchmaking:
  # Blueprint used when a matchmaking game type contains multiple eligible
  # definitions and no existing instance has capacity. first-available prefers
  # the explicitly requested blueprint, then stable ID order. random chooses
  # uniformly from eligible definitions. Existing ready instances are always
  # preferred before this policy runs.
  # Valid values: first-available, random.
  blueprint_selection: first-available
  # Positive integer. Maximum time, in seconds, a player may wait for a managed
  # server to become ready. Expired requests are removed from the queue.
  queue_timeout_seconds: 180

lifecycle:
  # Non-negative integer. Number of seconds an empty, ephemeral managed server
  # remains ready before SLS-LITE stops it. Use 0 to disable automatic idle
  # shutdown globally. Persistent servers and the active lobby are excluded.
  # Blueprints may override this policy with SLS-LITE lifecycle annotations.
  idle_shutdown_seconds: 180

compatibility:
  # Controls SLS-LITE's integration with ViaVersion's dynamic-backend protocol
  # map. auto is recommended: integrate when ViaVersion is installed and remain
  # native otherwise. on makes ViaVersion a startup requirement. off guarantees
  # SLS-LITE does not inspect or modify ViaVersion's backend protocol map.
  # Valid values: auto, on, off.
  viaversion_backend_sync: auto

storage:
  # Instance-directory preparation strategy. auto selects the first safe
  # exact-path capability in this order: reflink, eligible Btrfs snapshot,
  # kernel OverlayFS, rootless fuse-overlayfs, then transactional portable
  # copy. Per-source eligibility can still fall back safely under auto;
  # explicitly requested native strategies fail transactionally instead.
  # snapshot-hook is explicit-only and requires the bounded helper below.
  # Valid values: auto, copy, reflink, btrfs, overlay, fuse-overlay,
  # snapshot-hook.
  strategy: auto

  # Authoritative priority used only when strategy is auto. SLS-LITE probes and
  # selects only entries listed here, in this order. Remove a strategy to forbid
  # its use. Removing copy also forbids portable fallback; startup fails with
  # capability diagnostics if no listed strategy is available.
  # Valid entries: reflink, btrfs, overlay, fuse-overlay, copy. Do not use auto
  # or snapshot-hook here, and do not repeat entries.
  auto_priority: [reflink, btrfs, overlay, fuse-overlay, copy]

  # auto uses the conservative minimum of four and the JVM's available CPU
  # count. An explicit integer from 1 through 16 overrides that worker count.
  copy_parallelism: auto

  snapshot_hook:
    # Explicit-only, shell-free helper below the SLS-LITE data directory.
    # Required only when strategy is snapshot-hook.
    # executable: helpers/storage-snapshot
    timeout_seconds: 30

managed_output:
  # Boolean: true or false. When true, every managed server output line is also
  # written to the Velocity console with its instance ID. Keep false on busy or
  # resource-constrained networks to prevent console spam.
  mirror_to_proxy_console: false

  # Boolean: true or false. Writes managed output to
  # <instance>/logs/sls-lite-console.log. Ephemeral logs are deleted with their
  # instance directory. /sls logs works regardless of this setting because its
  # recent output is held in a separate bounded memory buffer.
  write_temporary_file: true

  # Positive integer from 1 through 1048576. Hard per-instance file limit in
  # KiB. SLS-LITE stops writing when the limit is reached and does not create
  # rotated archives. This value is still validated when file output is false.
  temporary_file_max_kib: 2048

# SLS-LITE's own lifecycle/probe detail stream. This is independent from
# managed child output above.
detailed_logging:
  # off, normal, or detailed. Normal retains important lifecycle and recovery
  # records without the probe/timing volume intended for diagnosis and testing.
  level: normal

  # Default false. Mirrors detailed records into the Velocity console without
  # suppressing concise milestones, warnings, failures, or command responses.
  mirror_to_proxy_console: false

  # Each file is capped and rotated. retained_files includes the active file.
  max_file_kib: 4096
  retained_files: 3

  # Bounded asynchronous queue. Full queues drop detail records rather than
  # blocking Velocity or lifecycle threads and emit logarithmically bounded
  # warnings.
  queue_capacity: 1024

  # Replace known host/data roots and absolute path-shaped values. Secret and
  # credential patterns are always redacted regardless of this option.
  redact_paths: true

diagnostics:
  # Short in-memory histories used by commands and the Java API. These are
  # independent from persistent per-instance and general SLS-LITE log files.
  # Zero disables the corresponding in-memory history. Hard line/byte/event
  # payload ceilings remain fixed safety limits and are not configurable.
  console_tail_lines: 1000
  installer_history_entries: 100
  failure_reports: 64

forwarding:
  # Player-information forwarding mode. Valid values:
  #   none   - disable Velocity forwarding in managed Paper servers. Suitable
  #            only for isolated development where player identity is not needed.
  #   modern - configure modern Velocity forwarding for managed Paper servers.
  #            Use this for a real network.
  mode: none

  # Boolean: true or false. Must match online-mode in velocity.toml when mode is
  # modern. This controls whether Paper expects Velocity to authenticate players.
  online_mode: true

  # Non-blank relative path from the Velocity working directory to the same
  # secret file configured by forwarding-secret-file in velocity.toml. Absolute
  # paths and paths escaping the Velocity directory are rejected. Replace
  # Velocity's placeholder with a private cryptographically random value of at
  # least 32 characters before enabling modern forwarding.
  secret_file: forwarding.secret

security:
  # Boolean: true or false. Persistent in-game SLS-LITE administrators are
  # identified by the UUID supplied by Velocity. Keep false on production
  # networks: offline-mode identities can be impersonated. Set true only for an
  # isolated development proxy where velocity.toml has online-mode=false and
  # you accept that risk. Console commands remain available either way.
  allow_insecure_offline_administrators: false

  # Positive integer. Lifetime, in seconds, of the one-time administrator claim
  # code printed to the proxy console. A code is also invalidated immediately
  # after one successful claim. Default: 600 seconds (10 minutes).
  claim_code_expiry_seconds: 600

presentation:
  transfer_action_bar:
    # Disable this entire surface when an extension supplies its own transfer
    # feedback. Text uses bounded MiniMessage; <server> is replaced safely.
    enabled: true
    joining: "<green>Joining <server>"
    force_joining: "<yellow>Force joining <server>"
    dequeued: "<red>You have been dequeued."
    # 1-32 bounded MiniMessage frames, cycled while a destination prepares.
    frames:
      - "<gold>▇▆▅▃▂▂▂▂▂"
      - "<gold>▆▇▆▅▃▂▂▂▂"
      - "<gold>▅▆▇▆▅▃▂▂▂"
      - "<gold>▃▅▆▇▆▅▃▂▂"
      - "<gold>▂▃▅▆▇▆▅▃▂"
      - "<gold>▂▂▃▅▆▇▆▅▃"
      - "<gold>▂▂▂▃▅▆▇▆▅"
      - "<gold>▂▂▂▂▃▅▆▇▆"
      - "<gold>▂▂▂▂▂▃▅▆▇"
      - "<gold>▂▂▂▂▃▅▆▇▆"
      - "<gold>▂▂▂▃▅▆▇▆▅"
      - "<gold>▂▃▅▆▇▆▅▃▂"
      - "<gold>▃▅▆▇▆▅▃▂▂"
      - "<gold>▅▆▇▆▅▃▂▂▂"
      - "<gold>▆▇▆▅▃▂▂▂▂"
    # Integer from 25 through 2000 milliseconds.
    frame_interval_millis: 72

lobby:
  # Lobby implementation. Valid values:
  #   velocity - preserve Velocity's native try/forced-host routing. SLS-Limbo
  #              is used only when Velocity has no initial destination.
  #   external - use an existing backend already registered in velocity.toml.
  #   managed  - start the configured SLS-LITE blueprint as a local child.
  mode: velocity
  # Managed mode only. When false, SLS-LITE does not prepare, resume, or recover
  # the configured primary. SLS-Limbo must remain enabled and handles all lobby
  # routing until this is set true and Velocity is restarted.
  auto_start: true

  # Non-blank registry/type name containing the managed lobby blueprint.
  # This value is ignored in velocity and external modes.
  registry: lobby

  # Non-blank server name.
  #   velocity mode: ignored; Velocity chooses from velocity.toml.
  #   external mode: exact Velocity registered-server name.
  #   managed mode: blueprint ID inside the registry above.
  server: lobby

  limbo:
    # Boolean: true or false. Starts the bundled, minimal SLS-Limbo before
    # checking the primary lobby. It provides a virtual placeholder while the
    # network is being configured or a player's destination is not ready.
    enabled: true

    # Positive integer, at least 64. Heap reservation in MiB for SLS-Limbo's
    # bundled NanoLimbo-derived runtime. Included in the managed memory budget.
    memory_mib: 96

    # Positive integer. Maximum seconds allowed for the SLS-Limbo runtime to
    # report readiness before SLS-LITE terminates it and marks it unavailable.
    startup_timeout_seconds: 30

    # Integer: -1 or a Minecraft protocol number of at least 770 (1.21.5).
    #   -1       - advertise each client protocol NanoLimbo supports natively.
    #   770+     - advertise a fixed, explicitly tested backend baseline for a
    #              proxy-installed ViaVersion to translate to. Older fixed
    #              baselines have unsafe heightmap translation behavior.
    # Keep -1 unless the selected protocol is listed as tested in
    # DOCS/Protocol_Compatibility.md. When ViaVersion is present, native mode is
    # exposed to ViaVersion as the safe 1.21.5 baseline instead of its internal
    # -1 sentinel. This does not install ViaVersion or make an unknown Minecraft
    # release compatible by itself.
    advertised_protocol: -1

    # Player-facing NanoLimbo presentation. Text fields use bounded MiniMessage.
    # Networking, forwarding, capacity, protocol, traffic, and lifecycle values
    # remain owned by SLS-LITE and are intentionally not exposed here.
    presentation:
      # Supported values: OVERWORLD, NETHER, THE_END.
      dimension: THE_END
      ping:
        # When false, the description is emitted as an empty string. The version
        # label remains configurable because the protocol response requires it.
        enabled: true
        description: "<gold>SLS-Limbo"
        version: "<gold>SLS-LITE"
      player_list:
        enabled: false
        username: "SLS-LITE"
      brand:
        enabled: true
        text: "<gold>SLS-Limbo"
      join_message:
        enabled: true
        text: "<yellow>You are in SLS-Limbo while your destination gets ready."
      boss_bar:
        enabled: true
        text: "<yellow>Waiting for your destination..."
        # Health is 0.0-1.0. Colors: PINK, BLUE, RED, GREEN, YELLOW,
        # PURPLE, WHITE. Divisions: SOLID, NOTCHED_6, NOTCHED_10,
        # NOTCHED_12, NOTCHED_20.
        health: 1.0
        color: YELLOW
        division: SOLID
      title:
        enabled: true
        title: "<gold>SLS-LITE"
        subtitle: "<yellow>SLS-Limbo"
        # Non-negative tick counts, each capped at 12000.
        fade_in_ticks: 10
        stay_ticks: 100
        fade_out_ticks: 10
      header_footer:
        enabled: false
        header: ""
        footer: ""

    recovery:
      # Non-negative integer. Maximum automatic restart attempts after an
      # unexpected SLS-Limbo failure. Use 0 to disable automatic recovery.
      max_attempts: 5

      # Positive integer. Delay before the first restart attempt.
      initial_backoff_seconds: 2

      # Positive integer greater than or equal to initial_backoff_seconds.
      # Exponential delays will not grow beyond this value.
      max_backoff_seconds: 30

      # Positive integer. Reset the used restart budget after SLS-Limbo remains
      # ready for this many seconds.
      stable_after_seconds: 120

  recovery:
    # Recovery settings apply only to managed mode.

    # Non-negative integer. Maximum automatic restart attempts after the managed
    # lobby crashes. Use 0 to disable automatic crash recovery.
    max_attempts: 5

    # Positive integer. Delay before the first restart attempt.
    initial_backoff_seconds: 5

    # Positive integer greater than or equal to initial_backoff_seconds.
    # Exponential restart delays will not grow beyond this value.
    max_backoff_seconds: 60

    # Positive integer. A recovered lobby must remain healthy for this many
    # seconds before its used restart-attempt budget is reset.
    stable_after_seconds: 120

paths:
  # Non-blank relative path for isolated managed instance directories. Absolute
  # paths and values that escape the SLS-LITE plugin data directory are rejected.
  # Do not point this at a software template or another server's live directory.
  instances: instances
