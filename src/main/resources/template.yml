# SLS-LITE blueprint using modern SLS terminology.

blueprint:
  id: template
  name: Template Server
  type: game

server:
  software: paper
  version: "26.1"
  limits:
    memory_limit: 2048

save: false

annotations:
  sls-lite:
    # Prevent automatic empty-server shutdown for priority services.
    keep-alive: false
    # Optional per-blueprint override; omit to use config.yml.
    idle-shutdown-seconds: 180
    start-on-proxy-start: false
    stop-when-empty: true
