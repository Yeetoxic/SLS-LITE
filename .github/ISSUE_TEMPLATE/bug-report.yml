name: Bug report
description: Report reproducible incorrect behavior in SLS-LITE.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test SLS-LITE. Remove credentials, forwarding secrets,
        player addresses, and other sensitive data before attaching configuration or logs.

  - type: input
    id: sls-lite-version
    attributes:
      label: SLS-LITE version
      description: Use the exact version shown by SLS-LITE or the release filename.
      placeholder: 0.1.0-rc.2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Velocity, Java, backend software, host/container, OS, and active COW strategy where relevant.
      placeholder: |
        Velocity:
        Java:
        Backend software:
        Host/container and OS:
        COW strategy:
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest reliable sequence, including relevant commands and redacted blueprint/config fragments.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics and logs
      description: Attach only the relevant section of the SLS-LITE detail log or redacted diagnostics. Do not include secrets.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the documentation and existing issues for this problem.
          required: true
        - label: I removed credentials, forwarding secrets, addresses, and other sensitive data.
          required: true
