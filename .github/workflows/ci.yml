name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Temurin 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile, test, package, analyze, and install locally
        run: mvn -B --no-transfer-progress clean install

      - name: Verify public API artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          api_jars=(target/sls-lite-*-api.jar)
          source_jars=(target/sls-lite-*-api-sources.jar)
          javadoc_jars=(target/sls-lite-*-api-javadoc.jar)
          if [[ ${#api_jars[@]} -ne 1 || ! -f "${api_jars[0]}" ]]; then
            echo "Expected exactly one public API classifier JAR" >&2
            exit 1
          fi
          if [[ ${#source_jars[@]} -ne 1 || ! -f "${source_jars[0]}" ]]; then
            echo "Expected exactly one public API sources JAR" >&2
            exit 1
          fi
          if [[ ${#javadoc_jars[@]} -ne 1 || ! -f "${javadoc_jars[0]}" ]]; then
            echo "Expected exactly one public API Javadoc JAR" >&2
            exit 1
          fi
          contents="$(jar tf "${api_jars[0]}")"
          grep -qx 'net/slimelabs/slslite/api/SLSLiteApi.class' <<<"$contents"
          grep -qx 'META-INF/licenses/LICENSE' <<<"$contents"
          leaks="$(grep -E '^net/slimelabs/slslite/.*\.class$' <<<"$contents" \
            | grep -Ev '^net/slimelabs/slslite/api/' || true)"
          internals="$(grep -E '^net/slimelabs/slslite/api/internal/' <<<"$contents" || true)"
          if [[ -n "$leaks" || -n "$internals" ]]; then
            echo "Public API classifier contains implementation classes:" >&2
            printf '%s\n%s\n' "$leaks" "$internals" >&2
            exit 1
          fi
          source_contents="$(jar tf "${source_jars[0]}")"
          grep -qx 'net/slimelabs/slslite/api/package-info.java' <<<"$source_contents"
          if grep -q '^net/slimelabs/slslite/api/internal/' <<<"$source_contents"; then
            echo "Public API sources contain implementation classes" >&2
            exit 1
          fi
          javadoc_contents="$(jar tf "${javadoc_jars[0]}")"
          grep -qx 'index.html' <<<"$javadoc_contents"
          if grep -q 'api/internal' <<<"$javadoc_contents"; then
            echo "Public API Javadocs contain implementation packages" >&2
            exit 1
          fi

      - name: Compile public API example extension
        run: mvn -B --no-transfer-progress -f examples/velocity-extension/pom.xml clean verify

      - name: Set up Gradle for the public API example
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.1.0"

      - name: Compile public API example extension with Gradle
        run: gradle -p examples/velocity-extension clean build

      - name: Compile Paper backend messaging example
        run: mvn -B --no-transfer-progress -f examples/paper-backend-sender/pom.xml clean verify

      - name: Upload plugin and public API developer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sls-lite-java25-${{ github.sha }}
          path: |
            target/sls-lite-*.jar
            !target/sls-lite-*-shaded.jar
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
