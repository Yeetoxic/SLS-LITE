name: API distribution smoke

on:
  workflow_dispatch:
    inputs:
      cleanup_draft:
        description: Delete the temporary draft release and tag after the smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: api-distribution-smoke
  cancel-in-progress: false

jobs:
  publish-draft:
    name: Publish private draft artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      project_version: ${{ steps.metadata.outputs.project_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Temurin 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile, test, and package distribution artifacts
        run: mvn -B --no-transfer-progress clean verify

      - name: Stage artifacts and checksums
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress help:evaluate \
            -Dexpression=project.version \
            -Doutput=target/project-version.txt \
            -q
          version="$(<target/project-version.txt)"
          tag="api-distribution-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir distribution
          cp "target/sls-lite-${version}.jar" distribution/
          cp "target/sls-lite-${version}-api.jar" distribution/
          cp "target/sls-lite-${version}-api-sources.jar" distribution/
          cp "target/sls-lite-${version}-api-javadoc.jar" distribution/
          (cd distribution && sha256sum -- *.jar > SHA256SUMS)
          printf 'project_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" distribution/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Internal API distribution smoke ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Private Stage 3.10 developer-artifact distribution test. This is not a release candidate." \
            --draft \
            --prerelease

  consume-draft:
    name: Consume artifacts on a clean runner
    needs: publish-draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub exposes draft releases only to tokens with push-level contents access.
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Temurin 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download draft-release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-draft.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir downloaded

      - name: Verify checksums and public API boundary
        env:
          PROJECT_VERSION: ${{ needs.publish-draft.outputs.project_version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd downloaded && sha256sum --check SHA256SUMS)
          api_jar="downloaded/sls-lite-${PROJECT_VERSION}-api.jar"
          source_jar="downloaded/sls-lite-${PROJECT_VERSION}-api-sources.jar"
          javadoc_jar="downloaded/sls-lite-${PROJECT_VERSION}-api-javadoc.jar"
          test -f "downloaded/sls-lite-${PROJECT_VERSION}.jar"
          test -f "$api_jar"
          test -f "$source_jar"
          test -f "$javadoc_jar"
          api_contents="$(jar tf "$api_jar")"
          grep -qx 'net/slimelabs/slslite/api/SLSLiteApi.class' <<<"$api_contents"
          if grep -q '^net/slimelabs/slslite/api/internal/' <<<"$api_contents"; then
            echo "Downloaded public API JAR contains implementation classes" >&2
            exit 1
          fi

      - name: Install only the downloaded API JAR
        env:
          PROJECT_VERSION: ${{ needs.publish-draft.outputs.project_version }}
        shell: bash
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress \
            org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="downloaded/sls-lite-${PROJECT_VERSION}-api.jar" \
            -DgroupId=net.slimelabs \
            -DartifactId=sls-lite \
            -Dversion="${PROJECT_VERSION}" \
            -Dclassifier=api \
            -Dpackaging=jar \
            -DgeneratePom=true
          test -f "$HOME/.m2/repository/net/slimelabs/sls-lite/${PROJECT_VERSION}/sls-lite-${PROJECT_VERSION}-api.jar"
          test ! -f "$HOME/.m2/repository/net/slimelabs/sls-lite/${PROJECT_VERSION}/sls-lite-${PROJECT_VERSION}.jar"

      - name: Compile the Maven example against the downloaded API
        env:
          PROJECT_VERSION: ${{ needs.publish-draft.outputs.project_version }}
        run: >-
          mvn -B --no-transfer-progress
          -f examples/velocity-extension/pom.xml
          -Dsls-lite.version=${PROJECT_VERSION}
          clean verify

      - name: Set up Gradle for the public API example
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.1.0"
          cache-disabled: true

      - name: Compile the Gradle example against the downloaded API
        env:
          PROJECT_VERSION: ${{ needs.publish-draft.outputs.project_version }}
        run: >-
          gradle -p examples/velocity-extension
          -PslsLiteVersion=${PROJECT_VERSION}
          clean build

      - name: Record retained draft
        env:
          RELEASE_TAG: ${{ needs.publish-draft.outputs.release_tag }}
        shell: bash
        run: |
          printf '### API distribution smoke passed\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Draft release: `%s`\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  cleanup-draft:
    name: Delete temporary draft when requested
    if: ${{ always() && needs.publish-draft.result == 'success' && inputs.cleanup_draft }}
    needs:
      - publish-draft
      - consume-draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete draft release and temporary tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-draft.outputs.release_tag }}
        run: >-
          gh release delete "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --cleanup-tag
          --yes
