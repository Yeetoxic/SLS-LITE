version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /examples/velocity-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      example-maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /examples/paper-backend-sender
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      example-maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /examples/velocity-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      example-gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
